  <title id="title">Club Friday multi-sport community logo</title>
  <desc id="desc">Club Friday multi-sport community logo: three people of different ages surrounding a simple multi-sport ball, joined by a curved line representing empathy, harmony, and justice. The club welcomes cricket, football, kabaddi, hockey, badminton, volleyball, athletics, and other healthy sports. The motto is Justice, Unity, Sport.</desc>

