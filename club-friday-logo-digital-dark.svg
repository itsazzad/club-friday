<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Club Friday digital community logo - dark background</title>
  <desc id="desc">Digital Club Friday logo for dark backgrounds showing three generations united around a multi-sport ball, with justice, unity, respect, and service to society as guiding values.</desc>
  <defs>
    <linearGradient id="badge-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F7F5"/>
      <stop offset="1" stop-color="#63B89B"/>
    </linearGradient>
    <path id="motto-arc" d="M154 145 Q320 48 486 145"/>
    <path id="name-arc" d="M140 480 Q320 545 500 480"/>
  </defs>

  <circle cx="320" cy="320" r="286" fill="none" stroke="url(#badge-ring)" stroke-width="18"/>
  <circle cx="320" cy="320" r="260" fill="#142331" stroke="#385064" stroke-width="3"/>

  <g fill="#F4F7F5" font-family="Avenir Next, Trebuchet MS, Arial, sans-serif" text-anchor="middle">
    <text font-size="17" font-weight="700" letter-spacing="2.5">
      <textPath href="#motto-arc" startOffset="50%"><tspan fill="#F4F7F5">JUSTICE</tspan><tspan fill="#63B89B">  •  UNITY  •  </tspan><tspan fill="#F0C75E">RESPECT</tspan></textPath>
    </text>
    <text font-size="40" font-weight="800" letter-spacing="4.5">
      <textPath href="#name-arc" startOffset="50%">CLUB FRIDAY</textPath>
    </text>
  </g>

  <g stroke="#142331" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#F2B544" d="M154 377v-37c0-46 29-76 66-76s66 30 66 76v37z"/>
    <circle cx="220" cy="226" r="34" fill="#F2B544"/>

    <path fill="#E96B50" d="M244 367v-45c0-56 33-91 76-91s76 35 76 91v45z"/>
    <circle cx="320" cy="174" r="38" fill="#E96B50"/>

    <path fill="#4E9B83" d="M354 377v-37c0-46 29-76 66-76s66 30 66 76v37z"/>
    <circle cx="420" cy="226" r="34" fill="#4E9B83"/>
  </g>

  <circle cx="320" cy="354" r="68" fill="#FFF4D6" stroke="#F0C75E" stroke-width="12"/>
  <path fill="none" stroke="#F0C75E" stroke-width="9" stroke-linecap="round" d="M320 294c-20 14-31 34-31 60s11 46 31 60m0-120c20 14 31 34 31 60s-11 46-31 60m-54-60h108"/>
  <path fill="#F0C75E" d="m151 398 12 12-12 12-12-12zM489 398l12 12-12 12-12-12z"/>
</svg>
