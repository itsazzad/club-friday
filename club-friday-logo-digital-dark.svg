    <path fill="#E96B50" d="M240 322c0-59 36-99 80-99s80 40 80 99v45H240z"/>
    <circle cx="320" cy="174" r="38" fill="#E96B50"/>
    <path fill="none" stroke="#E96B50" d="M276 303v70m88-70v70M272 330l-38 27m112-27 38 27M295 373l-28 58m78-58 28 58"/>

    <path fill="#4E9B83" d="M348 341c0-49 32-83 72-83s72 34 72 83v37H348z"/>
    <circle cx="420" cy="226" r="34" fill="#4E9B83"/>
