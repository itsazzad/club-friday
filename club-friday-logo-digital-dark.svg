<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 500" role="img" aria-labelledby="title desc">
  <title id="title">Club Friday digital community logo - dark background</title>
  <desc id="desc">Digital Club Friday dark-background logo using the freehand badge composition with three polished digital silhouettes representing younger, adult, and older members united around a multi-sport ball.</desc>

  <g stroke="#F4F7F5" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path fill="none" stroke="#F4F7F5" d="M103 333a178 178 0 1 1 306 0"/>

    <g id="younger-member" aria-label="Younger member">
      <circle cx="144" cy="175" r="23" fill="#F2B544"/>
      <path fill="#F2B544" stroke="#142331" d="M104 298v-33c0-36 17-57 40-57s40 21 40 57v33z"/>
    </g>

    <g id="adult-member" aria-label="Adult member">
      <circle cx="256" cy="130" r="23" fill="#E96B50"/>
      <path fill="#E96B50" stroke="#142331" d="M214 298v-65c0-45 18-70 42-70s42 25 42 70v65z"/>
    </g>

    <g id="older-member" aria-label="Older member">
      <circle cx="368" cy="175" r="23" fill="#4E9B83"/>
      <path fill="#4E9B83" stroke="#142331" d="M328 298v-33c0-36 17-57 40-57s40 21 40 57v33z"/>
    </g>

    <circle cx="256" cy="316" r="55" fill="#FFF4D6" stroke="#D9A441" stroke-width="12"/>
    <path fill="none" stroke="#D9A441" stroke-width="9" d="M256 273c-16 11-25 25-25 43s9 32 25 43m0-86c16 11 25 25 25 43s-9 32-25 43m-43-43h86"/>

    <path fill="none" stroke="#63B89B" d="M91 395c48 48 105 72 165 72s117-24 165-72"/>
    <path fill="#D9A441" stroke="#D9A441" stroke-width="6" d="m96 364 8 8-8 8-8-8z"/>
    <path fill="#D9A441" stroke="#D9A441" stroke-width="6" d="m416 364 8 8-8 8-8-8z"/>
  </g>

  <defs>
    <path id="motto-arc" d="M121 145 Q256 48 391 145"/>
    <path id="name-arc" d="M136 426 Q256 400 376 426"/>
  </defs>

  <g font-family="Avenir Next, Trebuchet MS, Arial, sans-serif" text-anchor="middle">
    <text font-size="12" font-weight="700" letter-spacing="1.5">
      <textPath href="#motto-arc" startOffset="50%"><tspan fill="#F4F7F5">JUSTICE</tspan><tspan fill="#63B89B"> • UNITY • </tspan><tspan fill="#F0C75E">RESPECT</tspan></textPath>
    </text>
    <text fill="#F4F7F5" font-size="27" font-weight="700" letter-spacing="3.5">
      <textPath href="#name-arc" startOffset="50%">CLUB FRIDAY</textPath>
    </text>
  </g>
</svg>
