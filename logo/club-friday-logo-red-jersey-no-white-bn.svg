  <title
     id="title">ক্লাব ফ্রাইডে লাল জার্সি লোগো - সাদা কালিবিহীন বিকল্প</title>
  <desc
     id="desc">যেসব প্রিন্টার সাদা কালি বা হোয়াইট আন্ডারবেস দিতে পারে না, তাদের জন্য একরঙা নেভি কালিতে তৈরি লাল জার্সির বিকল্প লোগো।</desc>
