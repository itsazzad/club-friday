<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 500" role="img" aria-labelledby="title desc">
  <title id="title">ক্লাব ফ্রাইডে বহু-ক্রীড়া সম্প্রদায়ের লোগো</title>
  <desc id="desc">ক্লাব ফ্রাইডে সম্প্রদায়ের লোগো: তিনটি বিমূর্ত সদস্য-ব্যাজ তরুণ, প্রাপ্তবয়স্ক ও প্রবীণ সদস্যদের একটি সরল বহুক্রীড়া বলের চারপাশে উপস্থাপন করে।</desc>

