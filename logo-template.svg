<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 500" role="img" aria-labelledby="title desc">
  <title id="title">{{TITLE}}</title>
  <desc id="desc">{{DESCRIPTION}}</desc>

    <g stroke="{{STRUCTURE}}" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <path fill="none" stroke="{{STRUCTURE}}" d="M103 333a178 178 0 1 1 306 0"/>

      <g id="younger-member" aria-label="younger-member">
        <rect x="114" y="218" width="60" height="58" rx="20" fill="{{YOUNGER}}" stroke="{{BADGE_OUTLINE}}"/>
        <circle cx="144" cy="247" r="7" fill="{{BADGE_INNER}}" stroke="none"/>
      </g>

      <g id="adult-member" aria-label="adult-member">
        <rect x="214" y="153" width="84" height="84" rx="26" fill="{{ADULT}}" stroke="{{BADGE_OUTLINE}}"/>
        <circle cx="256" cy="195" r="9" fill="{{BADGE_INNER}}" stroke="none"/>
      </g>

      <g id="older-member" aria-label="older-member">
        <rect x="338" y="218" width="60" height="58" rx="20" fill="{{OLDER}}" stroke="{{BADGE_OUTLINE}}"/>
        <circle cx="368" cy="247" r="7" fill="{{BADGE_INNER}}" stroke="none"/>
      </g>

      <circle cx="256" cy="316" r="55" fill="{{BALL_FILL}}" stroke="{{BALL_STROKE}}" stroke-width="{{BALL_STROKE_WIDTH}}"/>
      <path fill="none" stroke="{{BALL_PANEL}}" stroke-width="9" d="M256 273c-16 11-25 25-25 43s9 32 25 43m0-86c16 11 25 25 25 43s-9 32-25 43m-43-43h86"/>

      <path fill="none" stroke="{{ACTION}}" stroke-width="8" d="M181 316h-18M186 306l-15-10M186 326l-15 10M331 316h18M326 306l15-10M326 326l15 10"/>
      <path fill="none" stroke="{{JOINING}}" d="M103 333a178 178 0 0 1 306 0"/>

      <path fill="{{SYMBOL}}" stroke="{{SYMBOL}}" stroke-width="6" d="m106 90 8 8-8 8-8-8z"/>
      <path fill="{{SYMBOL}}" stroke="{{SYMBOL}}" stroke-width="6" d="m406 90 8 8-8 8-8-8z"/>
    </g>

    <defs>
      <path id="motto-arc" d="{{MOTTO_PATH}}"/>
      <path id="name-arc" d="{{NAME_PATH}}"/>
    </defs>

    <path d="{{MOTTO_PATH}}" fill="none" stroke="{{MOTTO_BACKDROP}}" stroke-width="{{MOTTO_BACKDROP_WIDTH}}" stroke-linecap="round"/>
    <path d="{{NAME_PATH}}" fill="none" stroke="{{NAME_BACKDROP}}" stroke-width="{{NAME_BACKDROP_WIDTH}}" stroke-linecap="round"/>

    <g font-family="{{TEXT_FAMILY}}" text-anchor="middle">
      <text font-size="{{MOTTO_SIZE}}" font-weight="700" letter-spacing="{{MOTTO_SPACING}}">
        <textPath href="#motto-arc" xlink:href="#motto-arc" startOffset="50%" dy="{{MOTTO_DY}}">{{MOTTO_MARKUP}}</textPath>
      </text>
      <text fill="{{NAME_FILL}}" font-size="{{NAME_SIZE}}" font-weight="800" letter-spacing="{{NAME_SPACING}}">
        <textPath href="#name-arc" xlink:href="#name-arc" startOffset="50%" dy="{{NAME_DY}}">{{NAME}}</textPath>
      </text>
    </g>
</svg>
